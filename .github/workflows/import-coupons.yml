name: Import coupon feed

on:
  workflow_dispatch:
  schedule:
    # Daily 06:00 UTC
    - cron: "0 6 * * *"

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run importer
        env:
          COUPON_FEED_URL: ${{ secrets.COUPON_FEED_URL }}
          COUPON_FEED_TOKEN: ${{ secrets.COUPON_FEED_TOKEN }}
        run: node scripts/import-coupons.mjs
      - name: Upload import artifact
        uses: actions/upload-artifact@v4
        with:
          name: coupon-feed-import
          path: data/feed.last-import.json
